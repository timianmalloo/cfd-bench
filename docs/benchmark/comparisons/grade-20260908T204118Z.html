numeral check, capabilities pullable forward), P8 prove it (CFD/LBM, gated on SPIKE-03). Key structural finding surfaced: COMMIT-01 is a dependency, not just a policy \u2014 it forces the VLM tier before the goal-driven experience, which is not the order enthusiasm would pick. Central risk named honestly: the differentiator (free surface) is last and might never arrive, leaving a very good XFLR5-for-hydrofoils; recommended a 1-2 week de-risking slice at week 15 costing ~4 percent of total to test the claim the other 96 percent rests on. Three natural stopping points identified with P6 as the honest v1 boundary at 72 percent. Four open questions listed that need user input before /specify, plus a recommendation to run /adddomainexperts first."}, {"shortname": "adddomainexperts-hydrofoil-cfd", "done_when": "Seven experts written to both host trees; registry, casting sheet, persona cards and persona audit updated; phasing plan revised; graph and audit current", "summary": "Seven domain experts added; roster is now 23 general + 7 domain = 30, in both host trees. Confirmed with the maintainer before writing. The six requested all passed the Simplifier gate, plus one recommended and confirmed: Composite Structures and Hydroelasticity, which closes GAP-02 \u2014 Phase 0 proved thickness has no hydrodynamic optimum and is set entirely by structure, leaving a variable decided by physics nothing in the stack could see, with a failure mode of physical injury. Hard vetoes: Computational Fluid Dynamicist (no convergence/mesh-independence/validation basis, or a low-order method outside its envelope), Experimental Fluid Dynamics Expert (comparison conditions not comparable or no uncertainty statement), GPU and CUDA Expert (non-reproducible kernel results or precision with no error budget), Composite Structures (geometry presented as rideable with no structural basis). Soft: OpenFOAM/SU2 Specialist, Parametric Geometry Expert. Advisory: CAD/CAM Interop, scope-adapted into a foreclo t runs clean against a real repo, and every field it reads is verified against the actual audit and coord schemas", "summary": "Built the grader for the harness benchmark: tools/grade-benchmarks.py (stdlib, ~700 lines), .claude/skills/grade-benchmarks/SKILL.md, and the Copilot mirror .github/prompts/grade-benchmarks.prompt.md generated from the skill body with knowledge paths remapped so the two harnesses read the same document. Signature: /grade-benchmarks repo1, repo2 - one repo per run, bare names resolve as siblings of the control repo. SPLIT: the script measures and never judges; the skill rules on what has no defensible ratio. The script reads each run repo by running THAT repo pack scripts from THAT repo cwd (coord doctor/metrics/class/session list/request list, audit-log selfcheck), so the reading matches the pack revision the run used. Deterministic scores for coordination, contention, task-focus and functionality; performance, parallelism and drift are marked judgment and carry no number on purpose - no absolute scale for speed, more parallelism is a cost multiplier not a result, and done_when->summary drift is a reading. Highest-value output is the claimed-vs-observed integrity table: run-report claims are held apart from git/audit/coord/tree and every divergence is a severity-tagged finding. TWO DEFECTS FOUND IN MY OWN GRADER BY SMOKE-TESTING IT AGAINST THIS REPO, both of the class it exists to catch. (1) Phase verification counted P0..P6 tokens appearing anywhere in an audit entry INCLUDING the free-text summary, so one entry that merely discussed the phasing plan scored a full 7/7 on final functionality; fixed to match only shortname/goal/done_when, the turn own identity. (2) Contention scored 1 - conflict_labelled_commits/merge_commits, which measures commit-message vocabulary rather than contention and handed a run with one clean merge a free 1.0; replaced with a real measurement - for every two-parent merge, diff both sides against the merge base an /* ---- the comparison radar (Kiviat): six deterministic 0-1 spokes, runs overlaid ---- */
function radarSpokes(runs){
  for(var i=0;i<runs.length;i++){
    var rd = (runs[i].derived||{}).radar;
    if(rd) return Object.keys(rd);
  }
  return [];
}
function kiviat(runs){
  var sec = el("section"); sec.id = "kiviat";
  sec.appendChild(el("h2",null,"Comparison radar"));
  sec.appendChild(el("p","note","Six deterministic 0-1 spokes per run, overlaid so runs stack for "
    + "comparison. A missing score sits at the centre. The judgment axes (performance, parallelism, "
    + "drift) are not plotted - they carry no defensible ratio, by design."));
  var spokes = radarSpokes(runs);
  if(spokes.length < 3){
    sec.appendChild(el("p","empty","Not enough scored spokes to plot a radar."));
    return sec;
  }
  var W=560, H=440, cx=W/2, cy=H/2+4, R=150, N=spokes.length;
  var s = svg("svg",{viewBox:"0 0 "+W+" "+H, width:"100%", height:"auto",
                     role:"img", "aria-label":"Comparison radar of deterministic scores"});
  function pt(ai, frac){
    var ang = -Math.PI/2 + ai*2*Math.PI/N;
    return [cx+Math.cos(ang)*R*frac, cy+Math.sin(ang)*R*frac];
  }
  [0.25,0.5,0.75,1].forEach(function(fr){
    var pts=[]; for(var a=0;a<N;a++){ var p=pt(a,fr); pts.push(p[0].toFixed(1)+","+p[1].toFixed(1)); }
    s.appendChild(svg("polygon",{points:pts.join(" "), fill:"none",
                                 stroke:"#cfc9bf", "stroke-width":"1"}));
  });
  for(var a=0;a<N;a++){
    var o=pt(a,1);
    s.appendChild(svg("line",{x1:cx, y1:cy, x2:o[0].toFixed(1), y2:o[1].toFixed(1),
                              stroke:"#e3dfd8", "stroke-width":"1"}));
    var lp=pt(a,1.16);
    var tx=svg("text",{x:lp[0].toFixed(1), y:lp[1].toFixed(1), fill:"#6d6a65",
      "font-size":"11", "font-family":"ui-sans-serif,system-ui,Segoe UI,Roboto,sans-serif",
      "text-anchor": lp[0]<cx-6?"end":(lp[0]>cx+6?"start":"middle"),
      "dominant-baseline": lp[1]<cy-4?"auto":(lp[1]>cy+4?"hanging":"middle")});
    tx.textContent = spokes[a];
    s.appendChild(tx);
  }
  runs.forEach(function(r, ri){
    var rd=(r.derived||{}).radar||{}, pts=[], col=PALETTE[ri%PALETTE.length];
    for(var a=0;a<N;a++){
      var v=rd[spokes[a]]; if(v===null||v===undefined) v=0;
      var p=pt(a, Math.max(0,Math.min(1,v))); pts.push(p[0].toFixed(1)+","+p[1].toFixed(1));
    }
    s.appendChild(svg("polygon",{points:pts.join(" "), fill:col, "fill-opacity":"0.12",
                                 stroke:col, "stroke-width":"2"}));
    for(var b=0;b<N;b++){
      var vv=rd[spokes[b]]; if(vv===null||vv===undefined) vv=0;
      var q=pt(b, Math.max(0,Math.min(1,vv)));
      s.appendChild(svg("circle",{cx:q[0].toFixed(1), cy:q[1].toFixed(1), r:"2.6", fill:col}));
    }
  });
  sec.appendChild(s);
  var lg=el("div"); lg.style.cssText="margin-top:8px;display:flex;flex-wrap:wrap;gap:14px";
  runs.forEach(function(r,ri){
    var it=el("span"); it.style.cssText="display:inline-flex;align-items:center;gap:6px;font-size:13px";
    var sw=el("span"); sw.style.cssText="display:inline-block;width:11px;height:11px;border-radius:2px;"
      + "background:"+PALETTE[ri%PALETTE.length];
    it.appendChild(sw);
    it.appendChild(document.createTextNode(r.identity.name+" (floor "+fmt(r.deterministic_floor)+")"));
    lg.appendChild(it);
  });
  sec.appendChild(lg);
  return sec;
}

function visible(){ return RUNS.filter(function(r){ return !S.hidden[r.identity.name]; }); }
function matches(label, values){
  if(!S.q) return true;
  var hay = (label+" "+values.map(function(v){return fmt(v);}).join(" ")).toLowerCase();
  return hay.indexOf(S.q.toLowerCase()) !== -1;
}
function same(values){
  var first = JSON.stringify(values[0]);
  return values.every(function(v){ return JSON.stringify(v) === first; });
}

/* ---- a metric-rows x run-columns table ---- */
function table(rows, header){
  var runs = visible();
  var wrap = el("div","wrap"), t = el("table");
  var thead = el("thead"), hr = el("tr");
  var th0 = el("th","metric", header); hr.appendChild(th0);
  runs.forEach(function(r){
    var th = el("th","run"+(S.pin===r.identity.name?" pin":""), r.identity.name);
    th.tabIndex = 0;
    th.title = "Click to pin this column";
    th.setAttribute("role","button");
    var toggle = function(){ S.pin = (S.pin===r.identity.name) ? null : r.identity.name; render(); };
    th.onclick = toggle;
    th.onkeydown = function(e){ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); toggle(); } };
    hr.appendChild(th);
  });
  thead.appendChild(hr); t.appendChild(thead);

  var tb = el("tbody"), shown = 0;
  rows.forEach(function(row){
    var label = row[0], values = row[1].filter(function(_,i){
      return !S.hidden[RUNS[i].identity.name];
    });
    if(S.diff && runs.length > 1 && same(values)) return;
    if(!matches(label, values)) return;
    shown++;
    var tr = el("tr");
    tr.appendChild(el("td","metric", label));
    values.forEach(function(v,i){
      var td = el("td", (S.pin===runs[i].identity.name?"pin ":"") + (v===null?"n":""));
      if(v === "judgment"){ td.className += " j"; td.textContent = "judgment"; }
      else if(label === "score" && typeof v === "number"){
        var box = el("div","score"), bar = el("div","bar"), fill = el("i");
        fill.style.width = Math.max(0, Math.min(1, v))*100 + "%";
        bar.appendChild(fill); box.appendChild(bar);
        box.appendChild(el("span","num", fmt(v, label)));
        td.appendChild(box);
      } else { td.className += " num"; td.textContent = fmt(v, label); }
      tr.appendChild(td);
    });
    tb.appendChild(tr);
  });
  if(!shown) tb.appendChild(el("tr")).appendChild(el("td","empty",
    S.diff ? "Every run agrees on every row here." : "No rows match the filter."))
    .colSpan = runs.length + 1;
  t.appendChild(tb); wrap.appendChild(t);
  return wrap;
}

function axisRows(key){
  var runs = visible();
  var rows = [["score", RUNS.map(function(r){
    var a = (r.axes||{})[key]||{}; return a.judgment ? "judgment" : (a.score===undefined?null:a.score);
  })]];
  var keys = [];
  RUNS.forEach(function(r){
    var vals = (((r.axes||{})[key]||{}).values)||{};
    Object.keys(vals).forEach(function(k){ if(keys.indexOf(k)===-1) keys.push(k); });
  });
  keys.forEach(function(k){
    rows.push([k.replace(/_/g," "), RUNS.map(function(r){
      var vals = (((r.axes||{})[key]||{}).values)||{};
      return (k in vals) ? vals[k] : null;
    })]);
  });
  return rows;
}

      ["build ok",build.attempted?build.build_ok:null],
      ["tests ok",build.attempted?build.test_ok:null]]);
  if(build.attempted && build.test_tail){
    body.appendChild(el("pre",null,build.test_tail));
  }

  h("Phases");

      ["named in audit",a.phases_in_audit],
      ["verification executed",a.phases_verification_executed]]);

  h("Coordination plan");
  if(plan.present){
    kv([["plan",plan.path],["tracks",plan.tracks],["serial spine",plan.serial_spine],
        ["seams",plan.seams],["struck tracks",plan.struck_tracks],
        ["artifact classes",plan.artifact_classes]]);
  } else { none("No coordination plan was written."); }

  h("Delegations");
  kv([["delegations",a.delegations],["distinct agents",a.distinct_agents],
      ["peak concurrency",a.peak_concurrency],["agent_seconds",a.agent_seconds],
      ["span_seconds",a.span_seconds],["speedup",a.speedup],
      ["without a budget",a.delegations_without_budget],
      ["over budget",a.delegations_over_budget]]);

  h("Drift exhibits - done_when vs summary");
  var pairs = ((a.selfcheck||{}).review_pairs)||[];

      var box = el("div","pair");
      box.appendChild(el("div","dw","done_when: " + (p.done_when||"(none)")));
      box.appendChild(el("div","sm", p.summary||""));
      var tag = el("div","dw"); tag.textContent = p.shortname||""; box.appendChild(tag);
      body.appendChild(box);
    });
  } else { none("No done_when -> summary pairs recorded."); }

  h("Contention");
  var cont = r.contention||{};
  kv([["merges examined",cont.merges_examined],
      ["files contended in a merge",(cont.contended_files||[]).length],
      ["of those, measured",cont.contended_measured],
      ["needing no human",cont.contended_free]]);
  var hot = (cont.contended_files||[]).concat([]);
  if(!hot.length) hot = (cont.hot_files||[]).map(function(f){
    return {path:f.path, merges:f.commits, class:f["class"]};
  });
  if(hot.length){
    body.appendChild(el("pre",null, hot.slice(0,12).map(function(f){
      return (f["class"]||"?") + "\t" + (f.merges||0) + "\t" + f.path;
    }).join("\n")));
  } else { none("No contention measured."); }

  h("Coordination layer state");

      [".gitattributes",c.gitattributes_present],["pre-commit hook",c.precommit_hook_present],
      ["sessions registered",c.sessions],["seams raised",c.seams_total],

    body.appendChild(el("pre",null, names.map(function(n){
      return by[n] + "\t" + n; }).join("\n")));
  } else { none("No skill attribution in the audit log."); }
  if((a.unexpected_skills||[]).length)
    kv([["outside the expected loop",a.unexpected_skills]]);

  d.appendChild(body);
  return d;
}

function syncControls(){

/* ---- exec-summary tiles: winner, per-run letter grades, headline metrics ---- */
function pickWinner(runs){
  if(V && V.ranking && V.ranking.length) return V.ranking[0].run;
  if(runs.length < 2) return null;
  var best = null;
  runs.forEach(function(r){
    var c = (r.derived||{}).composite_score;
    if(c !== null && c !== undefined && (best === null || c > best.c)) best = {name:r.identity.name, c:c};
  });
  return best ? best.name : null;
}
function tile(label, big, sub, accent){
  var d = el("div");
  d.style.cssText = "flex:1 1 150px;min-width:132px;background:var(--panel);border:1px solid "
    + "var(--line);border-radius:10px;padding:12px 14px";
  var l = el("div",null,label);
  l.style.cssText = "font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)";
  var b = el("div",null,big);
  b.style.cssText = "font-size:26px;font-weight:700;margin-top:4px;color:"+(accent||"var(--ink)");
  d.appendChild(l); d.appendChild(b);
  if(sub){ var s = el("div",null,sub); s.style.cssText="font-size:12px;color:var(--muted);margin-top:2px"; d.appendChild(s); }
  return d;
}
function execTiles(runs){
  var sec = el("section"); sec.id = "exec";
  var row = el("div"); row.style.cssText = "display:flex;flex-wrap:wrap;gap:12px;margin:4px 0 10px";
  row.appendChild(tile("Runs graded", String(runs.length), null));
  var win = pickWinner(runs);
  if(win){
    var wr = runs.filter(function(r){ return r.identity.name === win; })[0];
    var wg = wr ? (wr.derived||{}).grade : null;
    row.appendChild(tile(runs.length > 1 ? "Winner" : "Run", win, wg ? ("grade "+wg) : null, "var(--accent)"));
  }
  var high=0, med=0, low=0;
  runs.forEach(function(r){ (r.integrity||[]).forEach(function(f){
    if(f.severity==="high") high++; else if(f.severity==="medium") med++; else low++; }); });
  row.appendChild(tile("Integrity", high?"CRITICAL":(med?"CONCERNS":"CLEAN"),
    (high+med+low)+" finding(s)", high?"var(--hi)":(med?"var(--med)":"var(--ok)")));
  var bc=0; runs.forEach(function(r){ var c=(r.derived||{}).demonstrated_phases||0; if(c>bc) bc=c; });
  row.appendChild(tile("Phases demonstrated", bc+" / 7", runs.length>1?"best of set":null));
  var act = runs.filter(function(r){ return (r.snapshot||{}).run_active; }).length;
  if(act) row.appendChild(tile("Active", String(act), "provisional grade", "var(--med)"));
  sec.appendChild(row);
  var chips = el("div"); chips.style.cssText = "display:flex;flex-wrap:wrap;gap:10px";
  runs.forEach(function(r,i){
    var g=(r.derived||{}).grade||"n/a", c=(r.derived||{}).composite_score;
    var chip=el("div");
    chip.style.cssText="display:flex;align-items:center;gap:8px;background:var(--panel-2);border:1px "
      + "solid var(--line);border-radius:8px;padding:6px 10px";
    var gg=el("span",null,g); gg.style.cssText="font-size:20px;font-weight:700;color:"+PALETTE[i%PALETTE.length];
    chip.appendChild(gg);
    chip.appendChild(el("span",null,r.identity.name+(c!==null&&c!==undefined?(" \u00b7 "+c):"")));
    chips.appendChild(chip);
  });
  sec.appendChild(chips);
  return sec;
}

/* ---- repair items: improve the benchmark/prompt, and the AI-Forward pack ---- */
function repairsSection(runs){
  var sec=el("section"); sec.id="repairs";
  sec.appendChild(el("h2",null,"Repair items"));
  sec.appendChild(el("p","note","Deterministic candidates derived from each run's signals, plus any "
    + "the grader authored in the verdict. Target: the benchmark/prompt (the instrument) or the "
    + "AI-Forward pack."));
  var vr = (V && V.repairs) || {};
  [["Benchmark & prompt", ["prompt","benchmark"], "benchmark"],
   ["AI-Forward pack", ["pack"], "pack"]].forEach(function(gp){
    var rows=[];
    runs.forEach(function(r){ (r.repairs||[]).forEach(function(it){
      if(gp[1].indexOf(it.target)>=0) rows.push([r.identity.name,it]); }); });
    var vitems = vr[gp[2]] || [];
    if(!rows.length && !vitems.length) return;
    sec.appendChild(el("h3",null,gp[0]));
    var wrap=el("div","wrap"), t=el("table"), th=el("thead"), hr=el("tr");
    ["source","severity","item","evidence"].forEach(function(x,i){ hr.appendChild(el("th", i===2?"metric":null, x)); });
    th.appendChild(hr); t.appendChild(th); var tb=el("tbody");
    rows.forEach(function(p){
      var tr=el("tr");
      tr.appendChild(el("td",null,p[0]));
      tr.appendChild(el("td",null,p[1].severity));
      tr.appendChild(el("td","metric",p[1].item));
      tr.appendChild(el("td",null,p[1].evidence||""));
      tb.appendChild(tr);
    });
    vitems.forEach(function(s){
      var tr=el("tr");
      tr.appendChild(el("td",null,"verdict"));
      tr.appendChild(el("td",null,"\u2014"));
      tr.appendChild(el("td","metric",s));
      tr.appendChild(el("td",null,""));
      tb.appendChild(tr);
    });
    t.appendChild(tb); wrap.appendChild(t); sec.appendChild(wrap);
  });
  return sec;
}

/* ---- #16/#17 phase parity & lifecycle matrix ---- */
function phaseParity(runs){
  var sec=el("section"); sec.id="parity";
  sec.appendChild(el("h2",null,"Phase parity & lifecycle"));
  sec.appendChild(el("p","note","Furthest lifecycle state per phase: authored \u2192 gated \u2192 merged "
    + "\u2192 owner-reviewed \u2192 verified. VERIF = an executed verification signal."));
  var ABBR={"not started":"\u2013","authored":"auth","gated":"gate","merged":"merge","owner_reviewed":"ownr","verified":"VERIF"};
  var COLOR={"not started":"var(--muted)","authored":"var(--lo)","gated":"var(--lo)","merged":"var(--med)","owner_reviewed":"var(--accent)","verified":"var(--ok)"};
  var P=["P0","P1","P2","P3","P4","P5","P6"];
  var wrap=el("div","wrap"), t=el("table"), th=el("thead"), hr=el("tr");
  hr.appendChild(el("th","metric","run"));
  P.forEach(function(p){ hr.appendChild(el("th",null,p)); });
  th.appendChild(hr); t.appendChild(th); var tb=el("tbody");
  runs.forEach(function(r){
    var lc=(r.quality||{}).phase_lifecycle||{}, tr=el("tr");
    tr.appendChild(el("td","metric",r.identity.name));
    P.forEach(function(p){
      var stt=((lc[p]||{}).state)||"not started";
      var td=el("td",null,ABBR[stt]||"\u2013"); td.style.color=COLOR[stt]||"var(--ink)"; td.style.fontWeight="600";
      tr.appendChild(td);
    });
    tb.appendChild(tr);
  });
  t.appendChild(tb); wrap.appendChild(t); sec.appendChild(wrap);
  return sec;
}

/* ---- #13/#14/#15/#18/#20/#21/#22 rigor & resilience ---- */
function rigorResilience(runs){
  var sec=el("section"); sec.id="resilience";
  sec.appendChild(el("h2",null,"Rigor & resilience"));
  runs.forEach(function(r){
    var q=r.quality||{}, rr=q.review_rounds||{}, res=q.resilience||{}, qe=q.quota_events||{}, bo=q.budget_overrun||{};
    sec.appendChild(el("h3",null,r.identity.name));
    var ul=el("ul","learned");
    ul.appendChild(el("li",null,"resilience: "+res.label+" (halts "+res.halts+", adapts "+res.adapts+", fabrications "+res.fabrications+")"));
    ul.appendChild(el("li",null,"review rounds: "+rr.author+" author / "+rr.gate+" gate; "+rr.clear_with_amendments
      +" CLEAR-with-amendments of "+rr.bare_clears+" clears (first-submission-clean "+fmt(rr.first_submission_clean_rate)+")"));
    ul.appendChild(el("li",null,"model availability: "+qe.count+" event(s), "+qe.forced_model_changes+" forced model change(s)"));
    ul.appendChild(el("li",null,"budget overrun: "+bo.delegations_over_budget+" over budget, "+bo.overage_calls
      +" call overage, owner-recorded "+fmt(bo.owner_recorded)));
    ul.appendChild(el("li",null,"policy adaptations: "+((q.policy_adaptations||{}).count)+" \u00b7 supersessions: "+q.supersessions));
    sec.appendChild(ul);
    (qe.samples||[]).slice(0,2).forEach(function(s){ sec.appendChild(el("p","note","quota: "+s)); });
    ((q.policy_adaptations||{}).samples||[]).slice(0,2).forEach(function(s){ sec.appendChild(el("p","note","policy: "+s)); });
  });
  return sec;
}

function render(keepFocus){
  var active = keepFocus ? document.activeElement : null;
  var caret = active && active.selectionStart;
  var app = document.getElementById("app");
  app.textContent = "";
  var runs = visible();

  document.getElementById("meta").textContent =
    RUNS.length + " run(s), " + runs.length + " shown · generated " + D.generated;

  if(!runs.length){
    app.appendChild(el("p","empty","Every run is hidden. Turn one back on above."));
    syncControls();
    return;
  }

  var halted = runs.filter(function(r){ return r.outcome === "HALT"; });
  app.appendChild(execTiles(runs));
  if(halted.length){
    var s = el("section"); s.id = "halts";
    s.appendChild(el("h2",null,"Halts"));
    halted.forEach(function(r){
      var d = el("div","halt");
      d.appendChild(el("strong",null,r.identity.name));
      d.appendChild(document.createTextNode(" — " + (r.report.halt_line
        || "declared HALT in the report body (no BENCHMARK-HALT marker line)")));
      s.appendChild(d);
    });
    app.appendChild(s);
  }

  if(V){
    var vs = el("section"); vs.id = "verdict";
    vs.appendChild(el("h2",null,"Ranking"));
    if(!(V.ranking||[]).length){
      vs.appendChild(el("p","empty","No ranking recorded."));
    } else {
      var ol = el("ol","rank");
      V.ranking.forEach(function(r){
        var li = el("li");
        li.appendChild(el("strong",null,r.run||""));
        if(r.why) li.appendChild(el("div","sm", r.why));
        ol.appendChild(li);
      });
      vs.appendChild(ol);
    }
    if((V.downgrades||[]).length){
      vs.appendChild(el("h3",null,"Downgrades \u2014 reported complete, evidence absent"));
      var w = el("div","wrap"), t = el("table"), th = el("thead"), hr = el("tr");
      ["run","phase","missing evidence"].forEach(function(x,i){
        hr.appendChild(el("th", i===2?"metric":null, x)); });
      th.appendChild(hr); t.appendChild(th);
      var tb = el("tbody");
      V.downgrades.forEach(function(d){
        var tr = el("tr");
        tr.appendChild(el("td",null,d.run||""));
        tr.appendChild(el("td",null,d.phase||""));
        tr.appendChild(el("td","metric",d.missing||""));
        tb.appendChild(tr);
      });
      t.appendChild(tb); w.appendChild(t); vs.appendChild(w);
    }
    if((V.learned||[]).length){
      vs.appendChild(el("h3",null,"What the pack should learn"));
      var ul = el("ul","learned");
      V.learned.forEach(function(x){ ul.appendChild(el("li",null,x)); });
      vs.appendChild(ul);
    }
    app.appendChild(vs);
  }

  var sum = el("section"); sum.id = "summary";
  sum.appendChild(el("h2",null,"Summary"));
  sum.appendChild(el("p","note","A blank is not recorded and is excluded from the floor "
    + "rather than counted as zero. The floor averages only the axes with a defensible "
    + "ratio - it is a floor, not a grade."));
  sum.appendChild(table([
    ["outcome", RUNS.map(function(r){ return r.outcome; })],
    ["pack revision", RUNS.map(function(r){ return r.identity.pack_revision; })],
    ["coordination skills installed", RUNS.map(function(r){ return r.identity.has_coordination_skills; })],
    ["phases with verification executed", RUNS.map(function(r){ return (r.audit.phases_verification_executed||[]).length; })],
    ["phases claimed complete", RUNS.map(function(r){ return (r.report.phases_claimed_complete||[]).length; })],
    ["integrity findings", RUNS.map(function(r){ return (r.integrity||[]).length; })],
    ["deterministic floor", RUNS.map(function(r){ return r.deterministic_floor; })]
  ], "metric"));
  app.appendChild(sum);

  var dv = el("section"); dv.id = "derived";
  dv.appendChild(el("h2",null,"Derived metrics"));
  dv.appendChild(el("p","note","Deterministic ratios that sharpen the raw axes: how much of the "
    + "line-count was real output vs bookkeeping, and what a demonstrated phase actually cost. "
    + "A zero-denominator ratio reads 'not recorded', never a fabricated zero."));
  dv.appendChild(table(derivedRows(), "metric"));
  app.appendChild(dv);

  app.appendChild(fabrication(runs));
  app.appendChild(perPhase(runs));
  app.appendChild(snapshotSection(runs));
  app.appendChild(phaseParity(runs));
  app.appendChild(modelsVeto(runs));
  app.appendChild(phaseVelocity(runs));
  app.appendChild(rigorResilience(runs));
  app.appendChild(repairsSection(runs));

  AXES.forEach(function(pair){
    var key = pair[0], title = pair[1];
    var s = el("section"); s.id = key;
    s.appendChild(el("h2",null,title));
    var note = ((runs[0].axes||{})[key]||{}).note;
    if(note) s.appendChild(el("p","note",note));
    s.appendChild(table(axisRows(key), "measure"));
    var j = V && V.judgment && V.judgment[key];
    if(j){
      runs.forEach(function(r){
        var text = j[r.identity.name];
        if(!text) return;
        var box = el("div","pair");
        box.appendChild(el("div","dw", r.identity.name));
        box.appendChild(el("div","sm", text));
        s.appendChild(box);
      });
    }
    app.appendChild(s);
  });

  var ints = el("section"); ints.id = "integrity";
  ints.appendChild(el("h2",null,"Integrity — claimed vs observed"));
  ints.appendChild(el("p","note","What the run report says, beside what the record shows. "
    + "This is the gap that decides the ranking."));
  runs.forEach(function(r){
    var list = (r.integrity||[]).filter(function(f){
      if(!S.sev[f.severity]) return false;
      if(!S.q) return true;
      return (f.claim+" "+f.observed).toLowerCase().indexOf(S.q.toLowerCase()) !== -1;
    });
    ints.appendChild(el("h3",null,r.identity.name));
    if(!list.length){
      ints.appendChild(el("p","note ok", (r.integrity||[]).length
        ? "No finding matches the current filter."
        : "No divergence found between the run report and the record."));
      return;
    }
    var wrap = el("div","wrap"), t = el("table"),
        th = el("thead"), hr = el("tr");
    ["severity","claim","observed"].forEach(function(h,i){
      hr.appendChild(el("th", i?"metric":null, h));
    });
    th.appendChild(hr); t.appendChild(th);
    var tb = el("tbody");
    list.forEach(function(f){
      var tr = el("tr");
      var td = el("td");
      td.appendChild(el("span","sev "+f.severity, f.severity));
      tr.appendChild(td);
      tr.appendChild(el("td","metric", f.claim));
      tr.appendChild(el("td","metric", f.observed));
      tb.appendChild(tr);
    });
    t.appendChild(tb); wrap.appendChild(t); ints.appendChild(wrap);
  });
  app.appendChild(ints);

  var det = el("section"); det.id = "detail";
  det.appendChild(el("h2",null,"Per-run detail"));
  det.appendChild(el("p","note","The exhibits. Stage 2 of /grade-benchmarks has to quote from "
    + "here - a drift or parallelism verdict with no exhibit is an opinion."));
  runs.forEach(function(r){ det.appendChild(detail(r)); });
  app.appendChild(det);

  app.appendChild(kiviat(runs));

  syncControls();

  if(active && active.className === "search"){
    var s2 = document.querySelector("input.search");
    if(s2){ s2.focus(); if(caret !== null) s2.setSelectionRange(caret, caret); }
  }
}

function buildNav(){
  var nav = document.getElementById("nav");
  nav.textContent = "";
  var items = (V ? [["verdict","Ranking"]] : []).concat([["exec","Summary"],["summary","Facts"],["derived","Derived metrics"],["parity","Phase parity"],["fabrication","Fabrication"],["perphase","Per-phase evidence"],["snapshot","Snapshot & delta"],["models","Models & vetoes"],["velocity","Phase velocity"],["resilience","Rigor & resilience"],["repairs","Repair items"]])
      .concat(AXES).concat([["integrity","Integrity"],["detail","Per-run detail"],["kiviat","Comparison radar"]]);
  items.forEach(function(p){
    var a = el("a",null,p[1]); a.href = "#"+p[0]; nav.appendChild(a);
  });
}

document.getElementById("foot").textContent =
  "Extraction is deterministic and LLM-free: every number here was read from a run's own "
  + "git history, audit log, coordination store and source tree by tools/grade-benchmarks.py. "
  + "Performance, parallelism and drift carry no automatic score on purpose - there is no "
  + "absolute scale for speed, more parallelism is a cost multiplier rather than a result, "
  + "and whether a summary drifted from its stated done-when is a reading, not a count. "
  + "The canonical static view is the .md file beside this one.";

buildControls(); buildNav(); render();
})();
</script>
